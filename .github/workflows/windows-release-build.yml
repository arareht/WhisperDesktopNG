name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (if any)
        shell: powershell
        run: |
          if (Test-Path "WhisperCpp.sln") {
            msbuild.exe WhisperCpp.sln /t:Restore /p:Configuration=Release /p:Platform=x64 /m
          }

      - name: Build solution in Release/x64
        shell: powershell
        run: |
          msbuild.exe WhisperCpp.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Package Windows release artifact
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release"
          if (!(Test-Path $releaseDir)) {
            throw "Expected release output directory not found: $releaseDir"
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "WhisperDesktopNG-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -Force
          Get-ChildItem $releaseDir | Select-Object Name, Length

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktopNG-Windows-x64
          path: WhisperDesktopNG-Windows-x64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WhisperDesktopNG-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
